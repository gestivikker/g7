<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Trial Kompe G7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        esport: {
                            dark: '#0f172a', // slate-900
                            darker: '#0b1120',
                            accent: '#00ffcc', // Neon cyan
                            accentHover: '#00ccaa'
                        }
                    },
                    fontFamily: {
                        sans: ['Rajdhani', 'sans-serif'], // Changing font to a more tech/esports one
                        display: ['Teko', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Teko:wght@500;600;700&display=swap');
        
        body {
            background-color: #0b1120;
            background-image: radial-gradient(circle at top right, #1e293b, #0b1120);
            color: #f8fafc;
        }
        
        /* Custom animation for form elements */
        .fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Staggered delays for child elements */
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-500 { animation-delay: 500ms; }
        .delay-600 { animation-delay: 600ms; }
        .delay-700 { animation-delay: 700ms; }

        /* Custom Input Styling */
        .esport-input {
            background-color: rgba(30, 41, 59, 0.7);
            border: 1px solid #334155;
            color: white;
            transition: all 0.3s ease;
        }
        .esport-input:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
            outline: none;
        }
        
        /* Select dropdown styling */
        select.esport-input option {
            background-color: #0f172a;
            color: white;
        }
        
        /* Card styling with subtle neon border */
        .esport-card {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.9), rgba(11, 17, 32, 0.95));
            border: 1px solid rgba(0, 255, 204, 0.1);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 255, 204, 0.05);
            backdrop-filter: blur(10px);
        }

    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="esport-card rounded-xl w-full max-w-md p-8 overflow-hidden fade-in-up relative">
        
        <!-- Subtle background accent -->
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-esport-accent to-transparent opacity-75"></div>

        <div class="text-center mb-8 fade-in-up delay-100">
            <h1 class="text-5xl font-display text-white mb-1 uppercase tracking-wider">Join G7 <span class="text-esport-accent">Trial</span></h1>
            <p class="text-slate-400 text-sm font-sans">Isi formulir di bawah ini untuk mendaftar trial kompetitif tim G7.</p>
        </div>

        <form id="registrationForm" onsubmit="submitForm(event)" class="space-y-6">
            
            <!-- Nickname Input -->
            <div class="fade-in-up delay-200">
                <label for="nickname" class="block text-sm font-semibold text-slate-300 mb-1 tracking-wide">NICKNAME GAME</label>
                <input type="text" id="nickname" name="nickname" required
                    class="w-full px-4 py-3 rounded-md esport-input"
                    placeholder="Masukkan Nickname Anda">
            </div>

            <!-- Game ID Input -->
            <div class="fade-in-up delay-300">
                <label for="gameId" class="block text-sm font-semibold text-slate-300 mb-1 tracking-wide">ID GAME (SERVER)</label>
                <input type="text" id="gameId" name="gameId" required
                    class="w-full px-4 py-3 rounded-md esport-input"
                    placeholder="Contoh: 12345678 (1234)">
            </div>

            <!-- Role Selection -->
            <div class="fade-in-up delay-400">
                <label for="role" class="block text-sm font-semibold text-slate-300 mb-1 tracking-wide">ROLE UTAMA</label>
                <select id="role" name="role" required
                    class="w-full px-4 py-3 rounded-md esport-input">
                    <option value="" disabled selected class="text-slate-500">Pilih Role</option>
                    <option value="Jungler">Jungler</option>
                    <option value="Roamer">Roamer</option>
                    <option value="Mid Laner">Mid Laner</option>
                    <option value="Gold Laner">Gold Laner</option>
                    <option value="EXP Laner">EXP Laner</option>
                </select>
            </div>

            <!-- High Rank Input -->
            <div class="fade-in-up delay-500">
                <label for="highRank" class="block text-sm font-semibold text-slate-300 mb-1 tracking-wide">HIGH RANK (MIN 250*)</label>
                <input type="number" id="highRank" name="highRank" required min="250"
                    class="w-full px-4 py-3 rounded-md esport-input"
                    placeholder="Total Bintang">
                <p id="rankError" class="text-red-400 text-xs mt-1 hidden font-semibold">Maaf, High Rank minimal adalah 250 bintang.</p>
            </div>

            <!-- WhatsApp Number Input -->
            <div class="fade-in-up delay-600">
                <label for="waNumber" class="block text-sm font-semibold text-slate-300 mb-1 tracking-wide">NOMOR WHATSAPP</label>
                <input type="tel" id="waNumber" name="waNumber" required
                    class="w-full px-4 py-3 rounded-md esport-input"
                    placeholder="Contoh: 081234567890">
            </div>

            <!-- Submit Button -->
            <div class="pt-4 fade-in-up delay-700">
                <button type="submit"
                    class="w-full bg-esport-accent hover:bg-esport-accentHover text-esport-darker font-bold py-3 px-4 rounded-md shadow-[0_0_15px_rgba(0,255,204,0.4)] hover:shadow-[0_0_25px_rgba(0,255,204,0.6)] transition-all duration-300 flex justify-center items-center gap-2 uppercase tracking-widest">
                    <!-- WhatsApp Icon SVG -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-whatsapp" viewBox="0 0 16 16">
                      <path d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232"/>
                    </svg>
                    Kirim Pendaftaran
                </button>
            </div>
        </form>
    </div>

    <script>
        function submitForm(event) {
            event.preventDefault(); // Prevent default form submission

            // Get form values
            const nickname = document.getElementById('nickname').value.trim();
            const gameId = document.getElementById('gameId').value.trim();
            const role = document.getElementById('role').value;
            const highRank = parseInt(document.getElementById('highRank').value, 10);
            const waNumber = document.getElementById('waNumber').value.trim();
            
            const rankError = document.getElementById('rankError');
            const rankInput = document.getElementById('highRank');

            // Custom validation for High Rank
            if (highRank < 250) {
                rankError.classList.remove('hidden');
                rankInput.style.borderColor = '#ef4444'; // Red border on error
                rankInput.style.boxShadow = '0 0 10px rgba(239, 68, 68, 0.2)';
                return; // Stop submission
            } else {
                // Reset error state if valid
                rankError.classList.add('hidden');
                rankInput.style.borderColor = ''; // Reset to default CSS class
                rankInput.style.boxShadow = '';
            }

            // Target WhatsApp Number
            const targetPhone = "6285196942624"; // Indonesian prefix (62) replaces 0

            // Construct the message format
            const message = `🔥 *FORM TRIAL KOMPETITIF G7* 🔥\n\n` +
                            `*Nickname:* ${nickname}\n` +
                            `*ID Game:* ${gameId}\n` +
                            `*Role Utama:* ${role}\n` +
                            `*High Rank:* ${highRank} Bintang ⭐\n` +
                            `*No. WhatsApp:* ${waNumber}\n\n` +
                            `Siap mengikuti trial! 🎮`;

            // Encode the message for URL
            const encodedMessage = encodeURIComponent(message);

            // Construct WhatsApp URL (using wa.me for better mobile compatibility)
            const whatsappUrl = `https://wa.me/${targetPhone}?text=${encodedMessage}`;

            // Open WhatsApp in a new tab/window
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
